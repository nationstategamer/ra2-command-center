; Enhanced Red Alert 2 in-game extension settings (native UI 0.6.0).
; Command Center's UI & AI tab changes most of these for you.
; Close the game before editing by hand. 1 = on, 0 = off; a missing switch counts as on.
[UI]
; Enabled=0 turns off every addition below.
Enabled=1
ExtendedTooltips=1
PlacementPreview=1
HarvesterCounter=1
PowerCounter=1
KeepGameSpeed=1
; Keyboard commands (rebind in Options > Keyboard): I = next idle harvester, Ctrl+S = quick save to SAVEFFFF.SAV.
NextIdleHarvester=1
QuickSave=1
; Elapsed game time above the battlefield timers.
GameClock=1
; HealthBars: 0 stock (selected or under the mouse), 1 damaged units and buildings, 2 all.
HealthBars=1
; Autosave every AutosaveMinutes of real play (1-120) to SAVEFFF0-2.SAV, oldest first.
Autosave=1
AutosaveMinutes=10
; Range circle for your selected defenses.
RangeCircles=1
; Kills / Lost / Army value line above the clock.
MatchStats=1
